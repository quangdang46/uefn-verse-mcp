[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verse-docs-mcp"
version = "0.1.0"
description = "MCP server for querying Verse/Fortnite UEFN documentation via a packaged SQLite FTS5 index."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "quangdang46" }]
keywords = ["verse", "uefn", "fortnite", "mcp", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
verse-docs-mcp = "verse_docs_mcp.cli:main"

[tool.hatch.build]
packages = ["src/verse_docs_mcp"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/verse_docs_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/verse_docs_mcp/data" = "verse_docs_mcp/data"
